  --accent: #a0322d;

  --card-bg: #ffffff;
  --border: #e8e2d4;
  --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 8px rgba(0,0,0,0.03);
  --shadow-hover: 0 2px 4px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.06);
  --display: 'Fraunces', 'Charter', 'Georgia', serif;
  --body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1815;
    --bg-alt: #25221e;
    --text: #faf7f2;
    --muted: #a3a09a;
    --accent: #e87a6e;
    --accent-soft: #3a2622;
    --card-bg: #25221e;
    --border: #3a352e;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 2px 8px rgba(0,0,0,0.15);

  }
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px 12px;
  padding-top: max(14px, env(safe-area-inset-top));
  backdrop-filter: saturate(180%) blur(8px);
  -webkit-backdrop-filter: saturate(180%) blur(8px);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
}

.title-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 10px;
}

h1 {
  font-family: var(--display);
  font-weight: 500;
  font-size: 19px;
  letter-spacing: -0.01em;
  font-variation-settings: "opsz" 14;
}

h1 em {
  font-style: italic;
  color: var(--accent);
  font-weight: 500;
}

.count {
  font-family: var(--body);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.search-wrap {
  position: relative;
}

input[type="search"] {
  width: 100%;
  padding: 12px 40px 12px 14px;
  font-family: var(--body);
  font-size: 16px;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  -webkit-appearance: none;
  appearance: none;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}

input[type="search"]:focus {
  border-color: var(--accent);
  background: var(--card-bg);
}

input[type="search"]::placeholder {
  color: var(--muted);
}

.clear-btn {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  width: 28px;
  height: 28px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  border-radius: 14px;
  display: none;
  align-items: center;
  justify-content: center;
  transition: color 0.15s, background 0.15s;
}

.clear-btn.visible {
  display: flex;
}

.clear-btn:active {
  background: var(--bg-alt);
  color: var(--text);
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.action-btn {
  flex: 1;
  padding: 8px 12px;
  font-family: var(--body);
  font-size: 13px;
  font-weight: 500;
  background: var(--bg-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  letter-spacing: 0.01em;
}

.action-btn:active {
  background: var(--border);
  transform: scale(0.98);
}

.action-btn.primary {
  background: var(--accent);
  color: var(--card-bg);
  border-color: var(--accent);
}

.action-btn.primary:active {
  filter: brightness(0.9);
}

.families {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 12px 16px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}

.families::-webkit-scrollbar { display: none; }

.chip {
  flex-shrink: 0;
  padding: 6px 12px;
  font-family: var(--body);
  font-size: 12px;
  font-weight: 500;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}

.chip:active {
  transform: scale(0.95);
}

.chip.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

main {
  padding: 16px;
  max-width: 720px;
  margin: 0 auto;
}

.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow 0.2s, transform 0.2s;
  animation: fadeUp 0.4s ease both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card:nth-child(1) { animation-delay: 0.02s; }
.card:nth-child(2) { animation-delay: 0.05s; }
.card:nth-child(3) { animation-delay: 0.08s; }
.card:nth-child(4) { animation-delay: 0.11s; }
.card:nth-child(5) { animation-delay: 0.14s; }
.card:nth-child(6) { animation-delay: 0.17s; }
.card:nth-child(n+7) { animation-delay: 0.2s; }

.card-header {

.card-id {

.card-title-wrap {

.card-famille {

  font-size: 16px;
  line-height: 1.4;
  color: var(--text);

  background: var(--accent-soft);
  color: var(--accent);
  padding: 1px 3px;
  border-radius: 3px;
  font-style: normal;
  font-weight: 500;
}

.card-body {
  max-height: 0;
  overflow: hidden;

}

.card.expanded .card-body {
  max-height: 4000px;
}

.card-body-inner {
  padding: 0 18px 18px 18px;
  border-top: 1px solid var(--border);
  margin-top: 0;
  padding-top: 14px;
}

.block {
  margin-top: 14px;
}

.block:first-child {
  margin-top: 0;
}

.block-label {
  font-family: var(--body);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
  display: block;
}

.block-content {
  font-family: var(--body);
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text);
}

.block-content.muted {
  color: var(--muted);
  font-size: 13px;
  font-style: italic;
}

.block-content mark {
  background: var(--accent-soft);
  color: var(--accent);
  padding: 1px 3px;
  border-radius: 3px;
}

.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--muted);
}

.empty-state .icon {
  font-family: var(--display);
  font-style: italic;
  font-size: 48px;
  color: var(--accent);
  margin-bottom: 16px;
  font-variation-settings: "opsz" 144;

.empty-state h2 {
  font-family: var(--display);
  font-weight: 500;
  font-size: 18px;
  margin-bottom: 8px;
  color: var(--text);
}

.empty-state p {
  font-size: 13px;
}

footer {
  text-align: center;
  padding: 32px 24px;
  color: var(--muted);
  font-size: 11px;
  border-top: 1px solid var(--border);
  margin-top: 24px;
  letter-spacing: 0.03em;
}

footer .ref {
  font-family: var(--display);
  font-style: italic;
  color: var(--text);
}

@media (min-width: 720px) {
  header { padding: 20px 32px 16px; }
  h1 { font-size: 22px; }
  main { padding: 24px 32px; }

  .card-header { padding: 20px 22px; }
  .card-objection { font-size: 17px; }
  .card-id { font-size: 26px; }
}

    pivot: "La durée de vie d'une compétence technique est passée de 30 ans en 1987 à environ 5 ans aujourd'hui (estimation OCDE). Pour le code informatique, parfois 18 mois. La formation ne peut plus viser un métier stable, elle vise un portefeuille de compétences évolutives. Le discernement disciplinaire augmenté par l'IA est précisément l'une de ces compétences. Évaluer ce discernement, c'est former à apprendre en continu.",
    relance: "Le diplôme n'est plus un passeport à vie, c'est un visa renouvelable. L'évaluation doit refléter cette nouvelle économie de la compétence. Une certification figée vaut moins qu'une certification qui atteste une capacité d'adaptation. C'est ce que l'évaluation processuelle commence à mesurer.",
    mots_cles: ['métiers', 'disparaître', 'futur', 'obsolète', 'compétences', 'OCDE', 'durée de vie', 'diplôme']
  }
];

const FAMILIES = [...new Set(DATA.map(d => d.famille_short))];

const $ = id => document.getElementById(id);
const searchInput = $('search');
const clearBtn = $('clear');
const resultsEl = $('results');
const countEl = $('count');
const familiesEl = $('families');
const randomBtn = $('random');
const expandAllBtn = $('expand-all');
const resetBtn = $('reset');

let activeFamilies = new Set();
let currentQuery = '';
let allExpanded = false;

function normalize(s) {
  return s.toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/['']/g, "'");
}

function highlight(text, terms) {
  if (!text || terms.length === 0) return escapeHTML(text || '');
  const normalText = normalize(text);
  let escaped = escapeHTML(text);
  const positions = [];
  terms.forEach(term => {
    if (term.length < 2) return;
    const normTerm = normalize(term);
    let idx = 0;
    while ((idx = normalText.indexOf(normTerm, idx)) !== -1) {
      positions.push([idx, idx + normTerm.length]);
      idx += normTerm.length;
    }
  });
  if (positions.length === 0) return escaped;
  positions.sort((a, b) => a[0] - b[0]);
  const merged = [];
  positions.forEach(p => {
    if (merged.length && p[0] <= merged[merged.length - 1][1]) {
      merged[merged.length - 1][1] = Math.max(merged[merged.length - 1][1], p[1]);
    } else {
      merged.push([...p]);
    }
  });
  let result = '';
  let last = 0;
  merged.forEach(([start, end]) => {
    result += escapeHTML(text.slice(last, start));
    result += '<mark>' + escapeHTML(text.slice(start, end)) + '</mark>';
    last = end;
  });
  result += escapeHTML(text.slice(last));
  return result;
}

function escapeHTML(s) {
  if (!s) return '';
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function score(entry, terms) {
  if (terms.length === 0) return 1;
  const haystack = normalize(
    entry.objection + ' ' +
    entry.pivot + ' ' +
    (entry.donnee || '') + ' ' +
    (entry.exemple || '') + ' ' +
    (entry.relance || '') + ' ' +
    entry.mots_cles.join(' ') + ' ' +
    entry.famille
  );
  let s = 0;
  terms.forEach(t => {
    const nt = normalize(t);
    if (nt.length < 2) return;
    const inKeywords = entry.mots_cles.some(k => normalize(k).includes(nt));
    const inObjection = normalize(entry.objection).includes(nt);
    const inHay = haystack.includes(nt);
    if (inKeywords) s += 10;
    if (inObjection) s += 5;
    if (inHay) s += 1;
  });
  return s;
}

function renderFamilies() {
  familiesEl.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeFamilies.size === 0 ? ' active' : '');
  allChip.textContent = 'Toutes';
  allChip.onclick = () => { activeFamilies.clear(); renderFamilies(); render(); };
  familiesEl.appendChild(allChip);
  FAMILIES.forEach(f => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeFamilies.has(f) ? ' active' : '');
    chip.textContent = f;
    chip.onclick = () => {
      if (activeFamilies.has(f)) activeFamilies.delete(f);
      else activeFamilies.add(f);
      renderFamilies();
      render();
    };
    familiesEl.appendChild(chip);
  });
}

function render() {
  const terms = currentQuery.trim().split(/\s+/).filter(t => t.length > 0);
  let filtered = DATA;
  if (activeFamilies.size > 0) {
    filtered = filtered.filter(d => activeFamilies.has(d.famille_short));
  }
  if (terms.length > 0) {
    filtered = filtered
      .map(d => ({ entry: d, s: score(d, terms) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s)
      .map(x => x.entry);
  }
  countEl.textContent = filtered.length + (filtered.length > 1 ? ' questions' : ' question');
  if (filtered.length === 0) {
    resultsEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">∅</div>
        <h2>Aucun résultat</h2>
        <p>Essaie d'autres mots-clés, ou réinitialise les filtres.</p>
      </div>
    `;
    return;
  }
  resultsEl.innerHTML = filtered.map(d => renderCard(d, terms)).join('');
  resultsEl.querySelectorAll('.card-header').forEach(h => {
    h.addEventListener('click', () => {
      h.parentElement.classList.toggle('expanded');
    });
  });
}

function renderCard(d, terms) {
  const expandClass = allExpanded ? ' expanded' : '';
  return `
    <article class="card${expandClass}" data-id="${d.id}">
      <div class="card-header">
        <div class="card-id">${d.id}</div>
        <div class="card-title-wrap">
          <span class="card-famille">${escapeHTML(d.famille_short)}</span>
          <div class="card-objection">«&nbsp;${highlight(d.objection, terms)}&nbsp;»</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-body-inner">
          ${d.presuppose ? `
            <div class="block">
              <span class="block-label">Présupposé piégé</span>
              <div class="block-content muted">${highlight(d.presuppose, terms)}</div>
            </div>
          ` : ''}
          <div class="block">
            <span class="block-label">Réponse pivot</span>
            <div class="block-content">${highlight(d.pivot, terms)}</div>
          </div>
          ${d.donnee ? `
            <div class="block">
              <span class="block-label">Donnée</span>
              <div class="block-content">${highlight(d.donnee, terms)}</div>
            </div>
          ` : ''}
          ${d.exemple ? `
            <div class="block">
              <span class="block-label">Exemple</span>
              <div class="block-content">${highlight(d.exemple, terms)}</div>
            </div>
          ` : ''}
          ${d.relance ? `
            <div class="block">
              <span class="block-label">Relance</span>
              <div class="block-content">${highlight(d.relance, terms)}</div>
            </div>
          ` : ''}
        </div>
      </div>
    </article>
  `;
}

let searchTimer;
searchInput.addEventListener('input', e => {
  currentQuery = e.target.value;
  clearBtn.classList.toggle('visible', currentQuery.length > 0);
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 120);
});

clearBtn.addEventListener('click', () => {
  searchInput.value = '';
  currentQuery = '';
  clearBtn.classList.remove('visible');
  searchInput.focus();
  render();
});

randomBtn.addEventListener('click', () => {
  let pool = DATA;
  if (activeFamilies.size > 0) {
    pool = pool.filter(d => activeFamilies.has(d.famille_short));
  }
  if (pool.length === 0) return;
  const picked = pool[Math.floor(Math.random() * pool.length)];
  searchInput.value = '';
  currentQuery = '';
  clearBtn.classList.remove('visible');
  resultsEl.innerHTML = renderCard(picked, []);
  resultsEl.querySelector('.card').classList.add('expanded');
  resultsEl.querySelector('.card-header').addEventListener('click', e => {
    e.currentTarget.parentElement.classList.toggle('expanded');
  });
  countEl.textContent = 'tirage';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

expandAllBtn.addEventListener('click', () => {
  allExpanded = !allExpanded;
  expandAllBtn.textContent = allExpanded ? 'Tout replier' : 'Tout déplier';
  render();
});

resetBtn.addEventListener('click', () => {
  searchInput.value = '';
  currentQuery = '';
  clearBtn.classList.remove('visible');
  activeFamilies.clear();
  allExpanded = false;
  expandAllBtn.textContent = 'Tout déplier';
  renderFamilies();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

renderFamilies();
render();

// Enregistrement du service worker pour offline et installation PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>

</body>
</html>
